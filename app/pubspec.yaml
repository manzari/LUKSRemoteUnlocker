version: 0.2.1+3

environment:
  sdk: ^3.14.0

dependencies:
  biometric_vault: ^1.1.2
  drift: ^2.35.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
