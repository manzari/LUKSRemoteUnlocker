meta:
  description: Unlock LUKS-encrypted Linux servers that wait at the Dropbear pre-boot prompt, from your phone. Host keys are pinned, the boot is confirmed, and nothing leaves the device.
  tagline: Remote unlock for LUKS-encrypted servers.

