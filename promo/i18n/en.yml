hero:
  title: "Unlock LUKS servers from your phone."
  subtitle: "After a reboot, an encrypted server waits at the Dropbear pre-boot prompt. LUKS Remote Unlocker sends the passphrase, one tap per server or all at once, and checks that each one really booted."
  screenshot_1:
    icon: "fas fa-server"
    label: "A run over three servers, each with its own live log"
    image: "/assets/images/run-dark.jpg"
  screenshot_2:
    icon: "fas fa-server"
    label: "The list of servers, grouped"
    image: "/assets/images/hosts-dark.jpg"

features:
  tag: "Features"
  title: "Careful with your passphrase"
  subtitle: "A passphrase is only as safe as the server it is sent to, so the app checks before it sends and confirms after."
  items:
    - icon: "fas fa-server"
      title: "One tap, many servers"
      description: "Unlock one host, a group or all of them. Hosts run in parallel, each with its own live log, and a run keeps going with the screen off."
    - icon: "fas fa-shield-halved"
      title: "Pinned host keys"
      description: "The passphrase is sent only after the server's pre-boot key matches the pinned one. A changed key stops that host before login, and a run has no way to accept it anyway."
    - icon: "fas fa-circle-check"
      title: "Boot confirmed"
      description: "An unlock counts as done only when the booted system answers with a different SSH host key than the pre-boot one."
    - icon: "fas fa-fingerprint"
      title: "Encrypted vault"
      description: "SSH keys and passphrases are encrypted with XChaCha20-Poly1305. A fingerprint or face opens the vault through the phone's secure hardware, and a recovery password is the second way in."
    - icon: "fas fa-ban"
      title: "No blind retries"
      description: "Debian allows three passphrase tries by default. A rejected passphrase stops the host, so the app never spends a try on its own."
    - icon: "fas fa-eye-slash"
      title: "Nothing leaves the device"
      description: "No accounts, no telemetry, no cloud. The app talks only to the servers you configure, and passphrases are stripped from every log."

screenshots:
  tag: "Screenshots"
  title: "From setup to a booted server"
  subtitle: "Works with Debian and Ubuntu servers that run Dropbear in their initramfs."
  items:
    - icon: "fas fa-pen"
      label: "The form for a server: addresses, SSH key and passphrase"
      image: "/assets/images/host-form-light.jpg"
    - icon: "fas fa-key"
      label: "An SSH key with its public line and QR code"
      image: "/assets/images/key-light.jpg"
    - icon: "fas fa-server"
      label: "The list of servers, grouped"
      image: "/assets/images/hosts-light.jpg"
    - icon: "fas fa-shield-halved"
      label: "Confirming a new host key by its fingerprint"
      image: "/assets/images/host-key-light.jpg"
    - icon: "fas fa-list-check"
      label: "A run over three servers, each with its own live log"
      image: "/assets/images/run-light.jpg"

