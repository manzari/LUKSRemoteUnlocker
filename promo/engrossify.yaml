# Tenant config for the engrossify render API; the apppage build posts it to
# $ENGROSSIFY_URL/api/render and gets the privacy policy and the terms back.

slug: luksremoteunlocker
name: LUKS Remote Unlocker
languages: [en]
documents: [privacy, terms-of-service]
audience: both
legal_check_done: true

controller:
  name: Marco Manzari
  legal_form: Kleingewerbe
  address:
    street: c/o COCENTER, Koppoldstr. 1
    postal_code: "86551"
    city: Aichach
    country: DE
  email: mail@manzari.dev
  phone: "+49 30 55570662"

supervisory_authority:
  key: berlin

site:
  url: https://luksremoteunlocker.manzari.dev
  hosting_provider: Hetzner Online GmbH
  hosting_country: DE
  fonts_self_hosted: true

data_flows:
  # Static page: no cookies, no client-side storage, no third-party requests.
  cookies:
    enabled: false
  hosting:
    enabled: true
  # Checked against app/pubspec.yaml and the sources: no backend, analytics,
  # crash reporting, ads or attribution SDK. Add iOS here once it is released.
  local_app:
    enabled: true
    platforms: [Android, Linux desktop, command line]
    network_use: >-
      The app opens network connections only to the servers you have entered
      yourself. It connects to them over SSH to check their host key, to log
      in and to send the disk passphrase, and it checks whether they are
      reachable and have booted. These connections run directly between your
      device and your servers; we are not involved in them.
    permissions:
      - >-
        Notifications and foreground operation (Android): to show the progress
        of an unlock and to keep it running while the screen is off.
      - >-
        Fingerprint or face unlock (optional, switched on in the app): the
        check is carried out by your device, and the app never receives
        biometric data.
  # Served from the same host as the landing page.
  fdroid_repo:
    enabled: true
    url: https://fdroid.manzari.dev/fdroid/repo

# No sign-up and no backend.
user_accounts:
  enabled: false

processors:
  - name: Hetzner Online GmbH
    purpose: Hosting of the landing page and the F-Droid repository (static files, server logs)
    country: DE
    avv_url: https://www.hetzner.com/AV/DPA_de.pdf

retention:
  server_logs_days: 14

art21_objection:
  applicable: true
  contact: mail@manzari.dev

terms:
  service_description: >-
    LUKS Remote Unlocker is a free, open-source app (MIT license) for Android,
    Linux desktop and the command line. It unlocks LUKS-encrypted Linux servers
    that wait at the Dropbear pre-boot SSH prompt: it connects to the servers
    the user has entered, checks each server's pinned SSH host key, logs in
    with the SSH key assigned to that server, sends the disk passphrase and
    checks that the server has booted. Servers, SSH keys, passphrases and the
    run history are stored only on the user's device; private keys and
    passphrases are kept in an encrypted vault. The app has no user accounts
    and no backend, and it sends nothing to the provider or to any third
    party. The user is responsible for the servers they connect to and for
    keeping their own copies of keys and passphrases.
  # No price and no account, so no withdrawal clause and no order step.
  free_of_charge: true
  governing_law: DE
  jurisdiction: Berlin
