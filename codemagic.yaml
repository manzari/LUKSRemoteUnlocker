workflows:
  android-release:
    name: Android build and upload to internal test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.50.0
      java: 21
      android_signing:
        - luksremoteunlocker_release_key
      groups:
        - google_play
    scripts:
      - name: Write key.properties
        script: |
          cat > "$CM_BUILD_DIR/app/android/key.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build app bundle
        script: cd app && flutter pub get && flutter build appbundle --release
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Play accepts only drafts until the first release is rolled out in the Console.
        # Then set this to false and RELEASE_STATUS below to completed.
        submit_as_draft: true

  android-promote-closed:
    name: Android promote internal test to closed test
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment: &promote_environment
      groups:
        - google_play
      vars:
        PACKAGE_NAME: dev.manzari.luksremoteunlocker
        RELEASE_STATUS: draft
    scripts:
      - name: Promote the latest internal release
        script: |
          google-play tracks promote-release \
            --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS \
            --package-name "$PACKAGE_NAME" \
            --source-track internal \
            --target-track alpha \
            --release-status "$RELEASE_STATUS"

  android-promote-open:
    name: Android promote closed test to open test
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment: *promote_environment
    scripts:
      - name: Promote the latest closed test release
        script: |
          google-play tracks promote-release \
            --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS \
            --package-name "$PACKAGE_NAME" \
            --source-track alpha \
            --target-track beta \
            --release-status "$RELEASE_STATUS"

  android-promote-production:
    name: Android promote open test to production
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment: *promote_environment
    scripts:
      - name: Promote the latest open test release
        script: |
          google-play tracks promote-release \
            --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS \
            --package-name "$PACKAGE_NAME" \
            --source-track beta \
            --target-track production \
            --release-status "$RELEASE_STATUS"

  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: 3.50.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.manzari.luksremoteunlocker
    scripts:
      - name: Get packages
        script: cd app && flutter pub get
      - name: Apply signing profiles
        script: xcode-project use-profiles --project "app/ios/Runner.xcodeproj"
      - name: Build IPA
        script: cd app && flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
